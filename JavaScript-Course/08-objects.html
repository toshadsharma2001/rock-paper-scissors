 <!DOCTYPE html>
<html lang="en">
  <head>
    <title>Objects</title>
      
  </head>
  <body>
   
    <script>
      const product = {
        name: 'Socks',
        Price: 1090
      }; 

      console.log(product);
      console.log(product.name);
      console.log(product.Price);

      product.name = 'Tshirt';
      console.log(product);

      product.newProperty = true;
      console.log(product);

      delete product.newProperty;
      console.log(product);
    </script>
  </body>
</html>
